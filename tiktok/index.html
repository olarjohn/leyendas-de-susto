<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Conectar TikTok · Leyendas de susto</title>
<style>
  :root { --fondo: #14101c; --texto: #f3eefb; --suave: #b9aecb; --acento: #ff3b5c; --caja: #221b2e; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fondo); color: var(--texto);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 560px; width: 100%; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--suave); }
  textarea { width: 100%; box-sizing: border-box; height: 7rem; background: var(--caja); color: var(--texto); border: 1px solid #3a3050;
             border-radius: 8px; padding: .75rem; font: 13px ui-monospace, monospace; word-break: break-all; resize: none; }
  button { margin-top: .75rem; background: var(--acento); color: white; border: 0; border-radius: 8px; padding: .7rem 1.2rem;
           font-size: 1rem; font-weight: 600; cursor: pointer; }
  .error { color: #ffb4c0; }
</style>
</head>
<body>
<main>
  <h1>🌙 Casi listo</h1>
  <div id="ok">
    <p>Copia este enlace y pégalo en tu estudio, en <b>📤 Publicar en redes → TikTok</b>, campo
       “Si TikTok te llevó a otra página, pega aquí ese enlace”.</p>
    <textarea id="enlace" readonly></textarea>
    <button id="copiar">Copiar enlace</button>
    <p>El código vence en unos minutos y solo sirve en tu computador. Esta página no lo guarda ni lo envía a ningún lado.</p>
  </div>
  <p id="error" class="error" hidden></p>
</main>
<script>
  // Página de retorno del inicio de sesión con TikTok: solo muestra la dirección para pegarla en el estudio local.
  const q = new URLSearchParams(location.search);
  if (q.get("error")) {
    document.getElementById("ok").hidden = true;
    const e = document.getElementById("error");
    e.hidden = false;
    e.textContent = "TikTok no autorizó la conexión: " + (q.get("error_description") || q.get("error"));
  } else if (!q.get("code")) {
    document.getElementById("ok").innerHTML = "<p>Esta página recibe la autorización de TikTok para el estudio de videos. Ábrela desde el botón “Conectar TikTok” del estudio.</p>";
  } else {
    const caja = document.getElementById("enlace");
    caja.value = location.href;
    document.getElementById("copiar").onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); } catch { caja.select(); document.execCommand("copy"); }
      document.getElementById("copiar").textContent = "✓ Copiado";
    };
  }
</script>
</body>
</html>
